name: Publish site

# Deploys the landing page to https://kaas.rs/. That is the whole job — the
# book is a separate Pages site built and deployed from kaas-rs/kaas, which
# this page links to by absolute URL. No handoff, no token, no cron.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a superseded push just skips to the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/
          # The page is self-contained today (inline CSS/JS, data: URI
          # favicon); this keeps an assets/ dir working if one is added.
          if [ -d assets ]; then cp -r assets _site/; fi
          test -f _site/index.html   # the landing page must own the root

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
